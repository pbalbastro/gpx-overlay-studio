name = "gpx-overlay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The site in public/ is served as static assets; /api/* goes to the Worker
# (Strava OAuth and API proxy). Secrets, set once with `npx wrangler secret put`:
#   STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, COOKIE_KEY
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
